[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/mock", "crates/wire"]

[workspace.package]
version = "0.6.4"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/oszkar/oto"

[workspace.lints.rust]
# Note: unsafe is unavoidable in src/frb_generated.rs (FRB-generated FFI glue).
# We deny it per-crate in oto-core / oto-mock instead of at the workspace level.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
# Keep workspace-level lints conservative — `src/frb_generated.rs` is
# autogenerated by FRB and inherits these. Tighten in individual crates
# (oto-core, oto-mock) where we control the source.
all = { level = "warn", priority = -1 }

[workspace.dependencies]
oto-app = { path = "crates/app" }
oto-core = { path = "crates/core" }
oto-mock = { path = "crates/mock" }
oto-wire = { path = "crates/wire" }

# Low-level UPnP SOAP client used directly in oto-wire for production
# control operations (play/pause/vol/mute/state). Exact pin =0.8.0.
# See AGENTS.md §4.
sonos-api = "=0.8.0"

# Reactive event stack from upstream crates.io. Keep the whole SDK family
# aligned and re-run the hardware acceptance checks when upgrading.
# SDK 0.8 removes the reqwest/native-tls dependencies that required our fork.
sonos-sdk-state = "=0.8.0"
sonos-sdk-event-manager = "=0.8.0"
sonos-sdk-stream = "=0.8.0"
sonos-sdk-callback-server = "=0.8.0"

# XML parser used by oto-wire's DIDL-Lite track-metadata parser
# (parse_track_didl in control.rs). Already in the locked graph via
# sonos-api — unify, don't bump.
quick-xml = "=0.31.0"

# Raw socket options for SSDP — std::net has no API to pin a socket's
# outgoing multicast interface (IP_MULTICAST_IF), which is the multi-NIC
# fix in oto-wire/src/ssdp.rs (tatimblin/sonos-sdk#76). The integration
# uses socket2 directly to select multicast egress per NIC.
# §7-approved (review follow-up). Contained to oto-wire.
socket2 = "0.5"

# Blocking, runtime-free HTTP client for oto-wire's v0.5 model repopulate
# (device_description.rs): fetches `device_description.xml` for the
# `<modelName>`. Sonos's embedded server replies chunked even to an
# HTTP/1.0 request, which a raw TcpStream mis-frames (sonos-notes § SSDP
# "HTTP fetch quirk"); ureq handles chunked + bounded timeouts with a sync
# API matching the SOAP path. Share 3.4 with SDK discovery; the upstream SOAP
# client still requires ureq 2.x, so both majors remain in the resolved graph.
ureq = "=3.4.0"

# Log-emission facade for oto-wire's own diagnostics (per AGENTS.md §3:
# "oto-wire/oto-app may use anyhow at boundaries and tracing for logs").
# ALREADY in the locked graph (transitive via the sonos-sdk-* crates, which
# emit their own tracing calls); this only adds a direct edge to the
# already-resolved 0.1.x version, same precedent as ureq/socket2 above.
tracing = "0.1"

# Root crate: the FRB-exposed cdylib. Lives outside [workspace.members] but is
# implicitly a member because Cargo.toml is at the workspace root.
[package]
name = "oto_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
oto-app = { workspace = true }
oto-core = { workspace = true }

# Powers the `dev_discover_mock` + `dev_push_subscription_error_on_mock`
# FRB seams used by `app/integration_test/v0_4_events_test.dart` to drive
# the v0.4 event surface end-to-end without a LAN. Shipped unconditionally
# (not `cfg(debug_assertions)`-gated): FRB v2's `frb_generated.rs`
# unconditionally references every `pub fn` in `api.rs`, so cfg-gating
# the dev fns breaks the release cdylib link. Cost: one small internal
# workspace crate ends up in the release binary (negligible — no
# third-party transitive deps; `oto-mock` is std-only).
oto-mock = { workspace = true }

[dev-dependencies]
oto-app = { workspace = true }
# Dev-only: `examples/event-tail.rs` needs direct access to `SonosWire`.
# The library cdylib stays oto-app-only (oto-wire is a transitive dep
# through oto-app, never named in the FRB surface — keeps the
# "wire-is-an-internal-boundary" invariant from AGENTS.md §4).
oto-wire = { workspace = true }

[lints]
workspace = true
