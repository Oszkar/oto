[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/mock", "crates/wire"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/oszkar/oto"

[workspace.lints.rust]
# Note: unsafe is unavoidable in src/frb_generated.rs (FRB-generated FFI glue).
# We deny it per-crate in oto-core / oto-mock instead of at the workspace level.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
# Keep workspace-level lints conservative — `src/frb_generated.rs` is
# autogenerated by FRB and inherits these. Tighten in individual crates
# (oto-core, oto-mock) where we control the source.
all = { level = "warn", priority = -1 }

[workspace.dependencies]
oto-app = { path = "crates/app" }
oto-core = { path = "crates/core" }
oto-mock = { path = "crates/mock" }
oto-wire = { path = "crates/wire" }

# Wire-layer foundation. tatimblin/sonos-sdk handles SSDP discovery, UPnP
# SOAP control, and reactive event subscriptions. See docs/ARCHITECTURE.md.
# Exact pin: we depend (later, in oto-wire) on the `test-support`-gated
# `from_discovered_devices`, which is not semver-protected. See
# docs/plans/2026-05-15-discovery-spike-findings.md.
sonos-sdk = "=0.5.2"

# Root crate: the FRB-exposed cdylib. Lives outside [workspace.members] but is
# implicitly a member because Cargo.toml is at the workspace root.
[package]
name = "oto_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
oto-app = { workspace = true }
oto-core = { workspace = true }

[dev-dependencies]
oto-app = { workspace = true }
oto-mock = { workspace = true }

[lints]
workspace = true
