[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/mock", "crates/wire"]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/oszkar/oto"

[workspace.lints.rust]
# Note: unsafe is unavoidable in src/frb_generated.rs (FRB-generated FFI glue).
# We deny it per-crate in oto-core / oto-mock instead of at the workspace level.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
# Keep workspace-level lints conservative — `src/frb_generated.rs` is
# autogenerated by FRB and inherits these. Tighten in individual crates
# (oto-core, oto-mock) where we control the source.
all = { level = "warn", priority = -1 }

[workspace.dependencies]
oto-app = { path = "crates/app" }
oto-core = { path = "crates/core" }
oto-mock = { path = "crates/mock" }
oto-wire = { path = "crates/wire" }

# Low-level UPnP SOAP client used directly in oto-wire for production
# control operations (play/pause/vol/mute/state). Exact pin =0.5.2.
# See AGENTS.md §4.
sonos-api = "=0.5.2"

# v0.4 reactive event stack — the `tatimblin/sonos-sdk` family's
# `sonos-sdk-state` + `sonos-sdk-event-manager` + `sonos-sdk-stream` +
# `sonos-sdk-callback-server` crates. Wrap upstream GENA-driven property
# events into one `ChangeEvent` stream inside `oto-wire`. Pinned exact
# (same precedent as `sonos-api`); the v0.4 spike (see
# `docs/evidence/v0.4-spike/findings.md`) validated the 0.5.2 surface on
# real hardware. Do NOT bump without re-running the v0.4 acceptance gate.
sonos-sdk-state = "=0.5.2"
sonos-sdk-event-manager = "=0.5.2"
sonos-sdk-stream = "=0.5.2"
sonos-sdk-callback-server = "=0.5.2"

# XML parser used by oto-wire's DIDL-Lite track-metadata parser
# (parse_track_didl in control.rs). Already in the locked graph via
# sonos-api — unify, don't bump.
quick-xml = "=0.31.0"

# Raw socket options for SSDP — std::net has no API to pin a socket's
# outgoing multicast interface (IP_MULTICAST_IF), which is the multi-NIC
# fix in oto-wire/src/ssdp.rs (tatimblin/sonos-sdk#76). Already in the
# locked graph (transitive via reqwest/hyper); promoted to a direct dep.
# §7-approved (review follow-up). Contained to oto-wire.
socket2 = "0.5"

# Blocking, runtime-free HTTP client for oto-wire's v0.5 model repopulate
# (device_description.rs): fetches `device_description.xml` for the
# `<modelName>`. Sonos's embedded server replies chunked even to an
# HTTP/1.0 request, which a raw TcpStream mis-frames (sonos-notes § SSDP
# "HTTP fetch quirk"); ureq handles chunked + bounded timeouts with a sync
# API matching the SOAP path. ALREADY in the locked graph (transitive via
# sonos-api's SOAP client / webpki-roots — see deny.toml); this only adds a
# direct edge to the already-resolved version. §7-approved (2026-05-29).
# Exact pin so no second ureq major enters the build.
ureq = "=2.12.1"

# Root crate: the FRB-exposed cdylib. Lives outside [workspace.members] but is
# implicitly a member because Cargo.toml is at the workspace root.
[package]
name = "oto_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
oto-app = { workspace = true }
oto-core = { workspace = true }

# Powers the `dev_discover_mock` + `dev_push_subscription_error_on_mock`
# FRB seams used by `app/integration_test/v0_4_events_test.dart` to drive
# the v0.4 event surface end-to-end without a LAN. Shipped unconditionally
# (not `cfg(debug_assertions)`-gated): FRB v2's `frb_generated.rs`
# unconditionally references every `pub fn` in `api.rs`, so cfg-gating
# the dev fns breaks the release cdylib link. Cost: one small internal
# workspace crate ends up in the release binary (negligible — no
# third-party transitive deps; `oto-mock` is std-only).
oto-mock = { workspace = true }

# Android cross-compile only. `sonos-api` pulls `reqwest` with default
# features → `native-tls` → `openssl-sys`, and the Android NDK ships no
# system OpenSSL, so the `aarch64/x86_64-linux-android` build fails to
# build `openssl-sys`. Depending on `openssl` with `vendored` here flips
# the transitively-shared `openssl-sys` to build a vendored OpenSSL with
# the NDK toolchain. We make zero HTTPS calls (ureq + raw UDP); this
# exists solely so the Android link succeeds. Not pulled on Windows
# (native-tls uses SChannel there). Stays as long as sonos-api (pinned
# =0.5.2) pulls reqwest/native-tls.
#
# BUILD HOST: build the Android APK on Linux/macOS/WSL — vendored OpenSSL
# needs a full Perl 5 (Configure is Perl-driven), which those ship by
# default; Windows-native needs msys2 Perl and is discouraged (see
# CONTRIBUTING.md "Android cross-builds"). Validated on WSL→Pixel 7a
# 2026-05-30. Post-1.0: a rustls [patch.crates-io] migration would drop
# this vendored-OpenSSL/Perl dependency entirely (ROADMAP open items).
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
oto-app = { workspace = true }
# Dev-only: `examples/event-tail.rs` needs direct access to `SonosWire`.
# The library cdylib stays oto-app-only (oto-wire is a transitive dep
# through oto-app, never named in the FRB surface — keeps the
# "wire-is-an-internal-boundary" invariant from AGENTS.md §4).
oto-wire = { workspace = true }

[lints]
workspace = true
