[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/mock", "crates/wire"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/oszkar/oto"

[workspace.lints.rust]
# Note: unsafe is unavoidable in src/frb_generated.rs (FRB-generated FFI glue).
# We deny it per-crate in oto-core / oto-mock instead of at the workspace level.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
# Keep workspace-level lints conservative — `src/frb_generated.rs` is
# autogenerated by FRB and inherits these. Tighten in individual crates
# (oto-core, oto-mock) where we control the source.
all = { level = "warn", priority = -1 }

[workspace.dependencies]
oto-app = { path = "crates/app" }
oto-core = { path = "crates/core" }
oto-mock = { path = "crates/mock" }
oto-wire = { path = "crates/wire" }

# Low-level UPnP SOAP client used directly in oto-wire for production
# control operations (play/pause/vol/mute/state). Exact pin =0.5.2.
# See AGENTS.md §4.
sonos-api = "=0.5.2"

# XML parser used by oto-wire's DIDL-Lite track-metadata parser
# (parse_track_didl in control.rs). Already in the locked graph via
# sonos-api — unify, don't bump.
quick-xml = "=0.31.0"

# Root crate: the FRB-exposed cdylib. Lives outside [workspace.members] but is
# implicitly a member because Cargo.toml is at the workspace root.
[package]
name = "oto_native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
oto-app = { workspace = true }
oto-core = { workspace = true }

# Debug-only: powers the `dev_discover_mock` FRB seam used by
# `app/integration_test/v0_4_events_test.dart` to drive the v0.4
# event surface end-to-end without a LAN. The FRB fn is itself
# `cfg(debug_assertions)`-gated, so release builds never reference it.
# Stays a regular (non-dev) dependency so the Flutter debug build of
# the cdylib (which is what `flutter test integration_test/` uses)
# resolves the symbol.
oto-mock = { workspace = true }

# Android cross-compile only. `sonos-api` pulls `reqwest` with default
# features → `native-tls` → `openssl-sys`, and the Android NDK ships no
# system OpenSSL, so the `aarch64/x86_64-linux-android` build fails to
# build `openssl-sys`. Depending on `openssl` with `vendored` here flips
# the transitively-shared `openssl-sys` to build a vendored OpenSSL with
# the NDK toolchain. We make zero HTTPS calls (ureq + raw UDP); this
# exists solely so the Android link succeeds. Not pulled on Windows
# (native-tls uses SChannel there). Stays as long as sonos-api (pinned
# =0.5.2) pulls reqwest/native-tls.
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
oto-app = { workspace = true }
oto-mock = { workspace = true }

[lints]
workspace = true
