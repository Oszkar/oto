[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # `adler` reaches us transitively via
    # flutter_rust_bridge → backtrace → miniz_oxide → adler. No upgrade path
    # until FRB bumps its dep tree to use `adler2`. Revisit when FRB > 2.12.
    { id = "RUSTSEC-2025-0056", reason = "transitive via flutter_rust_bridge; no upgrade path locally" },
    # `paste` is an unmaintained proc-macro crate (advisory = unmaintained only,
    # no security impact). It is a transitive dependency of sonos-api: the full
    # path is paste → sonos-api → oto-wire. No upgrade path while sonos-api is
    # pinned =0.5.2.
    # TODO(v0.6): re-evaluate if the sonos-api pin is changed.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, transitive via sonos-api (paste → sonos-api → oto-wire); no upgrade path on pinned sonos-api =0.5.2" },
    # `quick-xml v0.31.0` - two DoS-class parsing advisories (RUSTSEC-2026-0194
    # quadratic duplicate-attribute check; RUSTSEC-2026-0195 unbounded
    # namespace-declaration allocation), both fixed in >=0.41.0. quick-xml is
    # pinned =0.31.0 transitively via sonos-api =0.5.2 (DIDL-Lite parsing), so
    # there is no local upgrade path while that pin holds. Practical exposure is
    # low: oto only parses XML returned by the user's own Sonos devices on the
    # LAN (SOAP/DIDL-Lite), never arbitrary untrusted input. This LAN-local
    # exposure is consistent with the accepted-risk trust stance ARCHITECTURE
    # records for discovery input (Known constraints: "SSDP responses are
    # trusted"). Revisit when the sonos-api pin is bumped to a release that
    # depends on quick-xml >=0.41.0.
    { id = "RUSTSEC-2026-0194", reason = "DoS in quick-xml <0.41; pinned =0.31.0 via sonos-api =0.5.2, no upgrade path; LAN-only XML input from the user's own devices" },
    { id = "RUSTSEC-2026-0195", reason = "DoS in quick-xml <0.41; pinned =0.31.0 via sonos-api =0.5.2, no upgrade path; LAN-only XML input from the user's own devices" },
    # RUSTSEC-2025-0134 (rustls-pemfile v1) formerly ignored here: it came
    # in via sonos-sdk-discovery's default-tls reqwest feature. Retired
    # 2026-07-01 when that feature was dropped (LOCAL_PATCHES.md #2) and
    # rustls-pemfile left the dependency graph entirely.
]

[licenses]
version = 2
# Keep forward-compatible allowances without warning when a license isn't
# currently encountered in the dep tree.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots (CDLA-Permissive-2.0): webpki-roots → ureq → sonos-sdk-soap-client → sonos-api → oto-wire.
    # CDLA-Permissive-2.0 is a permissive, patent-grant licence; compatible with MIT.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (`{ workspace = true }` and `{ path = "..." }`)
# look like wildcards to cargo-deny — they have no version requirement.
# Allow them; external wildcards are still denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# LOCAL PATCH (oto) fork - see native/Cargo.toml [patch.crates-io] and
# LOCAL_PATCHES.md #2.
allow-git = ["https://github.com/Oszkar/sonos-sdk"]
