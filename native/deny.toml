[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # `adler` reaches us transitively via
    # flutter_rust_bridge → backtrace → miniz_oxide → adler. No upgrade path
    # until FRB bumps its dep tree to use `adler2`. Revisit when FRB > 2.12.
    { id = "RUSTSEC-2025-0056", reason = "transitive via flutter_rust_bridge; no upgrade path locally" },
    # `paste` macro crate: unmaintained but no security impact; used transitively
    # via sonos-sdk → warp. Revisit when sonos-sdk bumps off warp 0.3. TODO(v0.2).
    { id = "RUSTSEC-2024-0436", reason = "transitive via sonos-sdk → warp; no upgrade path on pinned sonos-sdk =0.5.2" },
    # `rustls-pemfile` v1: superseded by v2; used transitively via reqwest 0.11
    # inside sonos-sdk. No upgrade path on pinned sonos-sdk =0.5.2. TODO(v0.2).
    { id = "RUSTSEC-2025-0134", reason = "transitive via sonos-sdk → reqwest 0.11; no upgrade path on pinned sonos-sdk =0.5.2" },
]

[licenses]
version = 2
# Keep forward-compatible allowances without warning when a license isn't
# currently encountered in the dep tree.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots (via ureq → sonos-sdk-soap-client → sonos-sdk → oto-wire → oto-app).
    # CDLA-Permissive-2.0 is a permissive, patent-grant licence; compatible with MIT.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (`{ workspace = true }` and `{ path = "..." }`)
# look like wildcards to cargo-deny — they have no version requirement.
# Allow them; external wildcards are still denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
