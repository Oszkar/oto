[package]
name = "oto-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Production wire layer: adapts tatimblin/sonos-sdk onto oto-core domain types."
publish = false

[lints]
workspace = true

[dependencies]
oto-core = { workspace = true }
# `test-support` exposes `SonosSystem::from_discovered_devices`, required for
# the multi-NIC SSDP workaround (sonos-sdk's built-in SSDP binds 0.0.0.0).
# This is a production code path, not test-only — see docs/ARCHITECTURE.md.
# Pinned =0.5.2 at the workspace; do not bump without re-checking this API
# (upstream tatimblin/sonos-sdk#76).
sonos-sdk = { workspace = true, features = ["test-support"] }
# Local interface enumeration for multi-NIC SSDP — std has no API for
# this. §7-approved (2026-05-15); contained to oto-wire. Win+Android+*nix.
if-addrs = "0.15"
