[package]
name = "oto-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Production wire layer: adapts sonos-api (tatimblin/sonos-sdk) onto oto-core domain types."
publish = false

[lints]
workspace = true

[features]
# Compile-gated hardware tests under `tests/live_*.rs`. CI does not
# enable this — the live tests need a real Sonos LAN and would either
# hang or fail spuriously. Hardware run:
#   cargo nextest run -p oto-wire --features live-tests --run-ignored ignored-only
# (The `#[ignore]` markers stay as belt-and-braces: even with the
# feature on, plain `cargo test` won't run them without `--ignored`.)
live-tests = []

[dependencies]
oto-core = { workspace = true }
# UPnP SOAP client for control operations (play/pause/next/previous/
# volume/mute/state). Direct dep; SonosClient + services::av_transport /
# rendering_control are not re-exported by any other dep.
# Promoted from dev-dep per Task 4 (v0.2). Pin =0.5.2 (workspace).
sonos-api = { workspace = true }
# Local interface enumeration for multi-NIC SSDP — std has no API for
# this. §7-approved (2026-05-15); contained to oto-wire. Win+Android+*nix.
if-addrs = "0.15"
# Pins each SSDP socket's outgoing multicast interface (IP_MULTICAST_IF)
# so a per-NIC M-SEARCH actually egresses that NIC instead of the OS
# default multicast interface — the multi-NIC send-side fix in ssdp.rs
# (tatimblin/sonos-sdk#76). std::net exposes no such API. Win+Android+*nix.
socket2 = { workspace = true }
# Non-blocking I/O multiplexing for the SSDP Phase-2 recv loop. The
# previous stdlib design used per-socket blocking reads with a 250 ms
# read timeout; on a host with many quiet sockets (VPN/Hyper-V/WSL
# vEthernet adapters that bind+send but never receive) a single Phase-2
# pass could consume the entire bounded window on timeouts and miss a
# responder bound to a later socket. mio::Poll waits collectively, so a
# quiet socket cannot consume any of the deadline. Win+Android+*nix.
mio = { version = "1.0", features = ["net", "os-poll"] }
# DIDL-Lite XML parser for track metadata (parse_track_didl). Already in
# the locked graph via sonos-api (transitive) — unify, don't bump.
quick-xml = { workspace = true }

# v0.4 Path A reactive event stack. `oto-wire` is the only crate that
# touches the Sonos SDK family (AGENTS.md §4). Pump thread in
# `events.rs` wraps `StateManager` + `SonosEventManager` watches into
# one `mpsc::Sender<ChangeEvent>`.
sonos-sdk-state = { workspace = true }
sonos-sdk-event-manager = { workspace = true }
# `stream` + `callback-server` are reached transitively (event-manager →
# stream → callback-server); their types are not named directly in `src/`.
# Declared explicitly anyway so the workspace `=0.5.2` pin actually binds
# them (a `[workspace.dependencies]` entry only pins what a crate
# references) — this holds the WHOLE reactive stack at the
# hardware-validated 0.5.2. Not dead deps; do not drop.
sonos-sdk-stream = { workspace = true }
sonos-sdk-callback-server = { workspace = true }

[dev-dependencies]
# Surfaces SDK tracing logs to stderr during interactive hardware tests
# so we can diagnose subscription / polling failures. Test-only; the
# production wire deliberately has no tracing subscriber configured
# (per oto-wire conventions in AGENTS.md — `tracing` may be used for
# log emission but a subscriber configuration is the app's choice).
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
] }
