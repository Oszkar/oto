name: oto
description: "A fast, local-first Sonos controller for Windows and Android."
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.6.1+8

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Native bridge.
  oto_native:
    path: rust_builder
  flutter_rust_bridge: 2.12.0

  # State management — Riverpod 3 with code generation.
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0

  # UI foundation (v0.6.0).
  shared_preferences: ^2.3.0
  flutter_svg: ^2.0.10
  lucide_icons_flutter: ^3.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Deterministic virtual time for the Throttle unit test (transitive via
  # flutter_test, pinned here for an explicit, stable import).
  fake_async: ^1.3.1

  # Riverpod codegen. (riverpod_lint + custom_lint dropped: custom_lint
  # 0.8.1's plugin-client generator ignores pubspec.lock and resolved
  # `riverpod_lint: ^3.0.0` against pub.dev's latest 3.1.3 while pub get
  # honored the lock at 3.0.3 — generated client referenced files that
  # didn't exist, plugin failed to start, ~50% of main CI pushes failed.
  # Base `flutter analyze` + `flutter_lints` covers everything else. Can
  # re-add when upstream stabilizes lockfile handling.
  build_runner: ^2.6.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
