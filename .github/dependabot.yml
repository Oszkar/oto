version: 2
updates:
  # GitHub Actions referenced in .github/workflows/*.
  #
  # `dtolnay/rust-toolchain` is IGNORED: it pre-publishes a branch for
  # every FUTURE Rust version (1.97 … 1.100 …) ahead of release, so
  # Dependabot picks the highest (`@1.100.0`) — which rustup can't install
  # because the latest real stable is far lower → every Rust CI job fails
  # (closed PR #12). The Rust MSRV is a deliberate floor, bumped MANUALLY
  # alongside rust-toolchain.toml + Cargo.toml per CONTRIBUTING.md, so
  # auto-PRs for it are pure noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  # Rust workspace.
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      sonos:
        patterns: ["sonos-api", "sonos-sdk-*"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["sonos-api", "sonos-sdk-*"]
    ignore:
      # FRB Rust/Dart/codegen must move together; tracked in #168.
      - dependency-name: "flutter_rust_bridge"
      # quick-xml is exact-pinned (=0.31.0) to share ONE version with
      # sonos-api / the sonos-sdk-* family ("unify, don't bump", see
      # workspace Cargo.toml). Bumping it (→0.40) breaks the DIDL parser
      # in control.rs AND splits the graph into two quick-xml versions.
      # Track sonos-api — bump only when it does (closed PR #57).
      - dependency-name: "quick-xml"
      # Hold socket2 at the validated 0.5 API for multicast egress selection.
      # An API migration needs the multi-NIC hardware checks.
      - dependency-name: "socket2"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # Flutter app dependencies.
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      pub:
        patterns: ["*"]
    # Coordinated generator/SDK upgrade is tracked in #168. Keep unrelated
    # updates flowing until a compatible package set has been validated.
    ignore:
      - dependency-name: "flutter_rust_bridge"
      - dependency-name: "flutter_riverpod"
      - dependency-name: "riverpod_annotation"
      - dependency-name: "riverpod_generator"
      - dependency-name: "freezed"
      - dependency-name: "freezed_annotation"
      - dependency-name: "build_runner"

  # Cargokit FFI shim — vendored boilerplate carrying a local patch
  # (see LOCAL_PATCHES.md). `ffigen` / `flutter_lints` are dev-only deps
  # here with zero runtime impact; bumping them only risks the local
  # patch and broke Flutter CI (closed PR #2). Ignored deliberately.
  - package-ecosystem: pub
    directory: /app/rust_builder
    schedule:
      interval: monthly
      time: "10:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      pub-rust-builder:
        patterns: ["*"]
    ignore:
      - dependency-name: "ffigen"
      - dependency-name: "flutter_lints"
