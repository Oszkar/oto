# Git hooks, managed by lefthook. Install with `just install-hooks`.

pre-commit:
  parallel: true
  commands:
    # Only the inputs that can change generated output: FRB codegen reads
    # native/src/api.rs (and mirrors types it references), build_runner reads
    # the annotated Dart plus pubspec. Without a glob a README typo paid a
    # full FRB codegen + build_runner build. CI's `Generated source freshness`
    # job remains the unconditional server-side backstop.
    generated:
      glob:
        - "native/**/*.rs"
        - "native/Cargo.toml"
        - "app/lib/**/*.dart"
        - "app/pubspec.yaml"
      run: dart scripts/verify_generated.dart
    # Mirrors CI's `cargo fmt` gate so formatting drift never reaches a PR.
    rustfmt:
      glob: "native/**/*.rs"
      run: cargo fmt --all --manifest-path native/Cargo.toml -- --check
      fail_text: Run `cargo fmt --all --manifest-path native/Cargo.toml`, then re-stage.

pre-push:
  parallel: false
  commands:
    # Mirrors CI's lint + test gates; catches red pushes before the PR does.
    clippy:
      run: cargo clippy --workspace --all-targets --manifest-path native/Cargo.toml -- -D warnings
    # cargo-nextest is a prerequisite, same as CI: `cargo install cargo-nextest`.
    test:
      root: "native/"
      run: cargo nextest run --workspace

commit-msg:
  scripts:
    # Conventional Commits subject-line gate; CI enforces the same shape on
    # PR titles (.github/workflows/pr-title.yml) since squash-merge means
    # only the title lands on main.
    "conventional.sh":
      runner: sh
